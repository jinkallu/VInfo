<!DOCTYPE html>
<html>
	<head>
		<meta charset=utf-8>
                <title>My first three.js app</title>
                <link rel="stylesheet" href="/static/mathquill.css"/>
                <script type=text/javascript src="{{
                  url_for('static', filename='jquery-3.4.1.min.js') }}"></script>
                <script type=text/javascript src="{{
                  url_for('static', filename='mathquill.js') }}"></script>

	</head>

	<body>
        <p>Type math here: <span id="math-field"></span></p>
        <p>LaTeX of what you typed: <span id="latex"></span></p>
        <button onclick="buttonClicked()">Click me</button>
        <p>From Python: <span id="msg"></span></p>

        <script>
          function buttonClicked()
          {
            $.ajax({
              url: "/postmethod", 
              javascript_data: "hi how are you",
              dataType: "json",
              type: 'POST',
              success: function(response) {
                $("#msg").html(response);
                console.log(response);
              },
              error: function(error) {
                console.log(error);
              }
            });
          }
        var mathFieldSpan = document.getElementById('math-field');
        var latexSpan = document.getElementById('latex');

        var MQ = MathQuill.getInterface(2); // for backcompat
        var mathField = MQ.MathField(mathFieldSpan, {
          spaceBehavesLikeTab: true, // configurable
          handlers: {
            edit: function() { // useful event handlers
              latexSpan.textContent = mathField.latex(); // simple API
            }
          }
        });
        </script>
	</body>
</html>
